spring.application.name=bank-zartow
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health

# Validation and other MVC errors are rendered as RFC 7807 ProblemDetail
# (application/problem+json), the error format mandated by CONVENTIONS.md.
spring.mvc.problemdetails.enabled=true

# Datasource connection comes from the environment (SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD). No defaults here so
# the application refuses to start without an explicitly configured database.

# The schema is owned by Flyway; Hibernate only validates that the entities
# match the migrated schema and never changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Single-account credentials. Intentionally NOT declared here: Spring binds them
# directly from the environment via relaxed binding (APP_AUTH_USERNAME ->
# app.auth.username, APP_AUTH_PASSWORD_HASH -> app.auth.password-hash). Declaring
# them as ${...} placeholders would be worse: an unset variable binds as the
# literal "${APP_AUTH_USERNAME}" (non-blank) and would slip past validation. With
# no declaration, a missing variable binds as null and pl.bankzartow.auth.
# AuthProperties rejects it, so the app refuses to start. The password is a bcrypt
# hash, never plain text, so no secret lives in the repository.

# Session cookie hardening. HttpOnly keeps it out of JavaScript; SameSite=Lax
# blocks it on cross-site requests. Secure is driven by the environment and must
# be true in production (HTTPS on Railway); it stays false for local HTTP dev.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
